    <path d="M819 385h70" stroke="#173b52" stroke-width="3"/>
    <path d="m879 376 14 9-14 9" fill="none" stroke="#173b52" stroke-width="3"/>

    <rect x="909" y="264" width="293" height="242" rx="12" fill="#ffffff" stroke="#d1cbc0"/>
    <text x="935" y="303" fill="#9a4e32" font-size="13" font-weight="700" letter-spacing="2">OUTPUTS</text>
    <text x="935" y="356" fill="#172b38" font-size="25" font-weight="700">Planning answers</text>
