<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">IAA Calculator functional map</title>
  <desc id="desc">An editorial diagram of the IAA Calculator showing academic credits and grades flowing through a Go calculation model to updated IAA and target-average results.</desc>
  <rect width="1280" height="720" fill="#ece8df"/>
  <g stroke="#d8d1c4" stroke-width="1" opacity=".75">
    <path d="M0 72h1280M0 144h1280M0 216h1280M0 288h1280M0 360h1280M0 432h1280M0 504h1280M0 576h1280M0 648h1280"/>
    <path d="M80 0v720M160 0v720M240 0v720M320 0v720M400 0v720M480 0v720M560 0v720M640 0v720M720 0v720M800 0v720M880 0v720M960 0v720M1040 0v720M1120 0v720M1200 0v720"/>
  </g>
  <rect x="38" y="36" width="1204" height="648" rx="22" fill="#faf8f3" stroke="#c8c1b5" stroke-width="2"/>
