    <text x="78" y="160" fill="#172b38" font-size="52" font-weight="700">IAA Calculator</text>
    <text x="78" y="196" fill="#5c6a70" font-size="20">UFSC academic-performance modeling with explicit inputs and targets.</text>

    <rect x="78" y="264" width="292" height="242" rx="12" fill="#ffffff" stroke="#d1cbc0"/>
    <text x="104" y="303" fill="#9a4e32" font-size="13" font-weight="700" letter-spacing="2">INPUTS</text>
    <text x="104" y="356" fill="#172b38" font-size="25" font-weight="700">Current record</text>
    <text x="104" y="396" fill="#5c6a70" font-size="17">Current IAA</text>
    <text x="104" y="430" fill="#5c6a70" font-size="17">Completed credits</text>
    <text x="104" y="464" fill="#5c6a70" font-size="17">Course grades + credits</text>

    <path d="M391 385h70" stroke="#173b52" stroke-width="3"/>
    <path d="m451 376 14 9-14 9" fill="none" stroke="#173b52" stroke-width="3"/>

    <rect x="481" y="238" width="318" height="294" rx="12" fill="#173b52"/>
    <text x="509" y="279" fill="#d9a15f" font-size="13" font-weight="700" letter-spacing="2">CALCULATION MODEL</text>
