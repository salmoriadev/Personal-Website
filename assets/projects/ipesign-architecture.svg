<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">IpeSign implemented signing flow</title>
  <desc id="desc">An editorial architecture diagram showing a PDF hash, an ephemeral X.509 document certificate, a signature, and an append-only ledger record.</desc>
  <rect width="1280" height="720" fill="#102f42"/>
  <path d="M0 610C248 570 423 694 694 635c215-47 370-28 586 24v61H0z" fill="#0b2636"/>
  <g fill="none" stroke="#315266" stroke-width="1" opacity=".5">
    <path d="M64 92h1152M64 628h1152M64 92v536M1216 92v536"/>
    <path d="M64 164h1152M64 556h1152" stroke-dasharray="4 10"/>
  </g>
  <text x="72" y="58" fill="#d9a15f" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">REPOSITORY-BASED ARCHITECTURE</text>
  <text x="72" y="145" fill="#fffdf7" font-family="Arial, sans-serif" font-size="56" font-weight="700">IpeSign</text>
  <text x="72" y="181" fill="#aec1cd" font-family="Arial, sans-serif" font-size="20">A Go signing core with per-document identity and auditable records.</text>
  <g font-family="Arial, sans-serif">
    <rect x="72" y="254" width="282" height="202" rx="12" fill="#f6f2e9"/>
    <text x="98" y="292" fill="#9a4e32" font-size="13" font-weight="700" letter-spacing="2">01 · INPUT</text>
    <text x="98" y="346" fill="#172b38" font-size="28" font-weight="700">PDF digest</text>
    <text x="98" y="382" fill="#536773" font-size="17">SHA-256 over the original file</text>
    <path d="M98 416h166" stroke="#c8cec9" stroke-width="2"/>
    <text x="98" y="439" fill="#172b38" font-family="monospace" font-size="15">document.pdf → hash</text>

    <path d="M374 355h56" stroke="#d9a15f" stroke-width="3"/>
    <path d="m421 346 13 9-13 9" fill="none" stroke="#d9a15f" stroke-width="3"/>

    <rect x="450" y="228" width="380" height="254" rx="12" fill="#fffdf7"/>
    <text x="478" y="268" fill="#9a4e32" font-size="13" font-weight="700" letter-spacing="2">02 · DOCUMENT IDENTITY</text>
    <text x="478" y="322" fill="#172b38" font-size="28" font-weight="700">Ephemeral X.509 cert</text>
    <text x="478" y="359" fill="#536773" font-size="17">Root CA → issuing CA → document cert</text>
    <rect x="478" y="391" width="324" height="58" rx="7" fill="#e9eef0"/>
    <text x="501" y="426" fill="#173b52" font-family="monospace" font-size="16">single-use key material</text>

    <path d="M850 355h56" stroke="#d9a15f" stroke-width="3"/>
    <path d="m897 346 13 9-13 9" fill="none" stroke="#d9a15f" stroke-width="3"/>

    <rect x="926" y="254" width="290" height="202" rx="12" fill="#f6f2e9"/>
    <text x="952" y="292" fill="#9a4e32" font-size="13" font-weight="700" letter-spacing="2">03 · RECORD</text>
    <text x="952" y="346" fill="#172b38" font-size="28" font-weight="700">Signed evidence</text>
    <text x="952" y="382" fill="#536773" font-size="17">Signature + certificate chain</text>
    <text x="952" y="413" fill="#536773" font-size="17">Append-only ledger record</text>
  </g>
  <g font-family="monospace" font-size="15">
    <text x="72" y="594" fill="#d7e2e7">Go</text>
    <text x="118" y="594" fill="#688493">/</text>
    <text x="145" y="594" fill="#d7e2e7">PostgreSQL</text>
    <text x="252" y="594" fill="#688493">/</text>
    <text x="279" y="594" fill="#d7e2e7">REST</text>
    <text x="329" y="594" fill="#688493">/</text>
    <text x="356" y="594" fill="#d7e2e7">encrypted private-key persistence</text>
    <text x="846" y="594" fill="#d9a15f">No embedded PDF signature or PAdES yet</text>
  </g>
</svg>
